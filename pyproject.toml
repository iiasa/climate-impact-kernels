[project]
name = "impacts"
version = "0.1.4"
description = "Domain-oriented climate-impact preprocessing utilities."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cftime>=1.6.5",
    "climateresponse",
    "dask>=2026.3.0",
    "netcdf4>=1.7.4",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "xarray>=2024.6.0",
]

[tool.uv.sources]
climateresponse = { path = "/home/raghunathan/climateresponse", editable = true }

[tool.setuptools.packages.find]
include = ["impacts*"]
