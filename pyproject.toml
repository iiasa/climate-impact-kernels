[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "impacts"
version = "0.1.8"
description = "Domain-oriented climate-impact preprocessing utilities with a shared xarray-native core."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cftime>=1.6.5",
    "dask>=2026.3.0",
    "netcdf4>=1.7.4",
    "numpy",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "xarray>=2024.6.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["impacts*"]

[tool.importlinter]
root_packages = ["impacts"]

[[tool.importlinter.contracts]]
name = "impacts.core does not depend on impacts domain modules"
type = "forbidden"
source_modules = ["impacts.core"]
forbidden_modules = [
    "impacts.thermoelectric",
    "impacts.buildings",
    "impacts.isimip",
    "impacts.kernel",
]
