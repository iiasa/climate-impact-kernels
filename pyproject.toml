[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "impacts"
version = "0.1.14"
description = "Domain-oriented climate-impact preprocessing utilities with a shared xarray-native core."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vignesh Raghunathan", email = "raghunathan@iiasa.ac.at"},
]
dependencies = [
    "cftime>=1.6.5",
    "dask>=2026.3.0",
    "netcdf4>=1.7.4",
    "numpy",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "xarray>=2024.6.0",
]

[project.urls]
Homepage = "https://github.com/iiasa/climate-impact-kernels"
Repository = "https://github.com/iiasa/climate-impact-kernels"
Issues = "https://github.com/iiasa/climate-impact-kernels/issues"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["impacts*"]

[tool.importlinter]
root_packages = ["impacts"]

[[tool.importlinter.contracts]]
name = "impacts.climatecore does not depend on impacts domain modules"
type = "forbidden"
source_modules = ["impacts.climatecore"]
forbidden_modules = [
    "impacts.domain",
    "impacts.isimip",
    "impacts.kernel",
]
