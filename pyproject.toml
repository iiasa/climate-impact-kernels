[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "impacts"
version = "0.1.27"
description = "Domain-oriented climate-impact preprocessing utilities with a shared xarray-native core."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vignesh Raghunathan", email = "raghunathan@iiasa.ac.at"},
]
dependencies = [
    "cftime>=1.6.5",
    "dask>=2026.3.0",
    "netcdf4>=1.7.4",
    "numpy",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "xarray>=2024.6.0",
]

[project.urls]
Homepage = "https://github.com/iiasa/climate-impact-kernels"
Repository = "https://github.com/iiasa/climate-impact-kernels"
Issues = "https://github.com/iiasa/climate-impact-kernels/issues"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["impacts*"]

[tool.setuptools.package-data]
"impacts.buildings" = ["data/*.csv"]

[tool.importlinter]
root_packages = ["impacts"]

[[tool.importlinter.contracts]]
name = "impacts.climatecore does not depend on impacts domain modules"
type = "forbidden"
source_modules = ["impacts.climatecore"]
forbidden_modules = [
    "impacts.thermoelectric",
    "impacts.buildings",
    "impacts.isimip",
    "impacts.engine",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Formatting is not enforced, so long lines are tolerated.
    "E501",
    # Physics comments and docstrings use unit and symbol characters (x, rho).
    "RUF001",
    "RUF002",
    "RUF003",
    # `type X = ...` creates a TypeAliasType at runtime; keep the TypeAlias form.
    "UP040",
]
